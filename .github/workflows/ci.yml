name: core-ci

on:
  pull_request:
    paths:
      - "services/**"
      - "libs/contracts/**"
      - "libs/messaging/src/**"
      - "tests/**"
      - "infra/scripts/db.py"
      - "infra/scripts/prepared_transactions.py"
      - "infra/compose.yaml"
      - "infra/Dockerfile.service"
      - "infra/staging/**"
      - "docs/deployment/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-staging.yml"
      - ".github/workflows/rollback-staging.yml"
      - ".github/workflows/hosted-smoke.yml"
  # No path filter on main: every merge is tested, and the image workflow
  # publishes only after this succeeds, so a filter here would silently skip
  # publication for any image input missing from the list (LM-047).
  push:
    branches: [main]

jobs:
  quality:
    name: Format, lint, and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Python and dependencies
        run: uv sync --python 3.12 --locked

      - name: Check formatting
        run: uv run ruff format --check services libs/contracts infra/scripts infra/staging tests

      - name: Run linting
        run: uv run ruff check services libs/contracts infra/scripts infra/staging tests

      - name: Run non-database tests
        run: uv run pytest services libs/contracts/tests tests --ignore=tests/db -q

  migrations:
    name: Database migrations and constraints
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: ledgermesh
          POSTGRES_PASSWORD: ledgermesh
          POSTGRES_DB: ledgermesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgermesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Set explicitly, so an unreachable database fails the job instead of skipping.
      LM_TEST_POSTGRES_URL: postgresql+psycopg://ledgermesh:ledgermesh@localhost:5432/ledgermesh

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --python 3.12 --locked

      - name: Enable PostgreSQL prepared transactions
        run: |
          container="$(docker ps --filter ancestor=postgres:17.11-alpine --format '{{.ID}}' | head -1)"
          test -n "$container"
          docker exec "$container" psql -U ledgermesh -d ledgermesh -c \
            "ALTER SYSTEM SET max_prepared_transactions = 100"
          docker restart "$container"
          for attempt in {1..30}; do
            if docker exec "$container" pg_isready -U ledgermesh -d ledgermesh; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "PostgreSQL did not become ready after restart" >&2
              exit 1
            fi
            sleep 1
          done
          value="$(docker exec "$container" psql -U ledgermesh -d ledgermesh -Atqc \
            'SHOW max_prepared_transactions')"
          test "$value" = "100"

      - name: Migrate every service and check its constraints
        run: uv run pytest tests/db -q

      - name: Run 2PC atomicity and blocking experiments
        run: make test-2pc-integration

      - name: Retain 2PC integration measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2pc-integration-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
