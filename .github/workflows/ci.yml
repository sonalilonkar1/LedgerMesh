name: core-ci

on:
  pull_request:
    paths:
      - "services/**"
      - "libs/contracts/**"
      - "libs/messaging/src/**"
      - "tests/**"
      - "infra/scripts/db.py"
      - "infra/compose.yaml"
      - "infra/Dockerfile.service"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "libs/contracts/**"
      - "libs/messaging/src/**"
      - "tests/**"
      - "infra/scripts/db.py"
      - "infra/compose.yaml"
      - "infra/Dockerfile.service"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/ci.yml"

jobs:
  quality:
    name: Format, lint, and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Python and dependencies
        run: uv sync --python 3.12 --locked

      - name: Check formatting
        run: uv run ruff format --check services libs/contracts tests

      - name: Run linting
        run: uv run ruff check services libs/contracts tests

      - name: Run service unit tests
        run: uv run pytest services -q

  migrations:
    name: Database migrations and constraints
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: ledgermesh
          POSTGRES_PASSWORD: ledgermesh
          POSTGRES_DB: ledgermesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgermesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Set explicitly, so an unreachable database fails the job instead of skipping.
      LM_TEST_POSTGRES_URL: postgresql+psycopg://ledgermesh:ledgermesh@localhost:5432/ledgermesh

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --python 3.12 --locked

      - name: Migrate every service and check its constraints
        run: uv run pytest tests/db -q
