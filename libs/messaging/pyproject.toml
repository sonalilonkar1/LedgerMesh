[project]
name = "ledgermesh-messaging"
version = "0.1.0"
description = "Transactional inbox and outbox for LedgerMesh services (LM-019)"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.11",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgermesh_messaging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs PostgreSQL from docker-compose.test.yml",
    "kafka: needs Kafka from docker-compose.test.yml",
]
