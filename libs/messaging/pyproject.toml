[project]
name = "ledgermesh-messaging"
version = "0.1.0"
description = "Transactional inbox and outbox and Kafka topics for LedgerMesh services (LM-018, LM-019)"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.11",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-sdk>=1.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
]

[project.scripts]
ledgermesh-topics = "ledgermesh_messaging.topics:main"
ledgermesh-dlq = "ledgermesh_messaging.dlq:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgermesh_messaging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs PostgreSQL from docker-compose.test.yml",
    "kafka: needs Kafka from docker-compose.test.yml",
]
