openapi: 3.1.0
info:
  title: LedgerMesh Redemption Coordinator API
  version: 1.0.0
  description: Public synchronous API for creating and querying reward redemptions.
servers:
  - url: http://localhost:8000
paths:
  /internal/v1/2pc/in-doubt:
    get:
      operationId: listInDoubtTwoPhaseCommitTransactions
      summary: List 2PC transactions awaiting recovery or participant acknowledgement
      description: Available only in explicitly configured local or test environments.
      responses:
        "200":
          description: In-doubt transactions ordered from oldest to newest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InDoubtTransactionView"
        "404":
          $ref: "#/components/responses/Problem"
  /internal/v1/2pc/recovery/run:
    post:
      operationId: runTwoPhaseCommitRecovery
      summary: Run one bounded 2PC recovery scan
      description: Available only in explicitly configured local or test environments.
      responses:
        "200":
          description: Recovery scan counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryRunResponse"
        "404":
          $ref: "#/components/responses/Problem"
  /internal/v1/redemptions/{transaction_id}/execute-2pc:
    post:
      operationId: executeTwoPhaseCommit
      summary: Run or resume the durable 2PC workflow
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Current durable Coordinator state after this execution attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionResponse"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/redemptions:
    post:
      operationId: createRedemption
      summary: Create or return an idempotent redemption
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRedemptionRequest"
      responses:
        "202":
          description: Redemption accepted or an existing idempotent request returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/redemptions/{transaction_id}:
    get:
      operationId: getRedemption
      summary: Get the current redemption state
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Current redemption state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionResponse"
        "404":
          $ref: "#/components/responses/Problem"
  /internal/v1/redemptions/{transaction_id}/transitions:
    post:
      operationId: transitionRedemption
      summary: Durably apply one valid Coordinator state transition
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
      responses:
        "200":
          description: Updated redemption state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionResponse"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listRedemptionTransitions
      summary: Return durable transition history in ledger order
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Ordered transition history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransitionView"
        "404":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Request could not be completed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    InDoubtTransactionView:
      type: object
      additionalProperties: false
      required: [transaction_id, status, workflow_step, updated_at, recovery_action]
      properties:
        transaction_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PREPARING, COMMIT_DECIDED, ABORT_DECIDED]
        workflow_step:
          type: integer
          minimum: 0
        updated_at:
          type: string
          format: date-time
        recovery_action:
          type: string
          enum: [PRESUME_ABORT, RETRANSMIT_COMMIT, RETRANSMIT_ABORT]
    RecoveryRunResponse:
      type: object
      additionalProperties: false
      required: [scanned, recovered, still_in_doubt, failed]
      properties:
        scanned:
          type: integer
          minimum: 0
        recovered:
          type: integer
          minimum: 0
        still_in_doubt:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
    TransitionRequest:
      type: object
      additionalProperties: false
      required: [to_status]
      properties:
        to_status:
          type: string
          enum:
            - REQUESTED
            - PREPARING
            - COMMIT_DECIDED
            - ABORT_DECIDED
            - COMMITTED
            - ABORTED
            - DEDUCTING_POINTS
            - POINTS_DEDUCTED
            - RESERVING_INVENTORY
            - COMPENSATING
            - COMPLETED
            - FAILED
            - COMPENSATED
        reason:
          type: [string, "null"]
          maxLength: 2000
    TransitionView:
      type: object
      additionalProperties: false
      required: [sequence, from_status, to_status, workflow_step, reason, created_at]
      properties:
        sequence:
          type: integer
          minimum: 1
        from_status:
          type:
            - string
            - "null"
          enum:
            - null
            - REQUESTED
            - PREPARING
            - COMMIT_DECIDED
            - ABORT_DECIDED
            - COMMITTED
            - ABORTED
            - DEDUCTING_POINTS
            - POINTS_DEDUCTED
            - RESERVING_INVENTORY
            - COMPENSATING
            - COMPLETED
            - FAILED
            - COMPENSATED
        to_status:
          type: string
          enum:
            - REQUESTED
            - PREPARING
            - COMMIT_DECIDED
            - ABORT_DECIDED
            - COMMITTED
            - ABORTED
            - DEDUCTING_POINTS
            - POINTS_DEDUCTED
            - RESERVING_INVENTORY
            - COMPENSATING
            - COMPLETED
            - FAILED
            - COMPENSATED
        workflow_step:
          type: integer
          minimum: 0
        reason:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    CreateRedemptionRequest:
      type: object
      additionalProperties: false
      required: [user_id, reward_id, quantity, coordination_mode]
      properties:
        user_id:
          type: string
          minLength: 1
        reward_id:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        coordination_mode:
          type: string
          enum: [two_phase_commit, saga]
    RedemptionResponse:
      type: object
      additionalProperties: false
      required: [transaction_id, correlation_id, status, coordination_mode, created_at, updated_at]
      properties:
        transaction_id:
          type: string
          format: uuid
        correlation_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - REQUESTED
            - PREPARING
            - COMMIT_DECIDED
            - ABORT_DECIDED
            - COMMITTED
            - ABORTED
            - DEDUCTING_POINTS
            - POINTS_DEDUCTED
            - RESERVING_INVENTORY
            - COMPENSATING
            - COMPLETED
            - FAILED
            - COMPENSATED
        coordination_mode:
          type: string
          enum: [two_phase_commit, saga]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        transaction_id:
          type: [string, "null"]
          format: uuid
