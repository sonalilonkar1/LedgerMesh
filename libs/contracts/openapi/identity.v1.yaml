openapi: 3.1.0
info:
  title: LedgerMesh Identity API
  version: 1.0.0
  description: >-
    Passwordless email sign-in (LM-052). A login request emails a single-use link;
    verifying it creates a server-side session carried in an HttpOnly cookie.
    Responses never reveal whether an account exists.
servers:
  - url: http://identity:8005
paths:
  /v1/auth/login-requests:
    post:
      operationId: requestLoginLink
      summary: Email a single-use sign-in link; the response is identical for every valid address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "202":
          description: Accepted; a link is sent if the address can receive email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginRequestAccepted"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/verify:
    get:
      operationId: getLoginConfirmPage
      summary: >-
        Static confirmation page opened by the emailed link. The token is in the URL
        fragment, which browsers never send; the page consumes nothing.
      responses:
        "200":
          description: HTML page whose button posts the token to POST /v1/auth/verify
          content:
            text/html:
              schema:
                type: string
    post:
      operationId: verifyLoginLink
      summary: Consume a sign-in link once and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: Signed in; the response sets the session cookie
          headers:
            Set-Cookie:
              description: "lm_session=<id>; HttpOnly; SameSite=Lax; Path=/; Max-Age=...; Secure outside local/test"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session (if any) and clear its cookie
      security:
        - {}
        - sessionCookie: []
      responses:
        "204":
          description: Signed out; idempotent
        "415":
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: The signed-in user and role
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/sessions/introspect:
    get:
      operationId: introspectSession
      summary: Resolve a forwarded session cookie to a principal (for trusted callers such as the web BFF)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionIntrospection"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/operator/auth-events:
    get:
      operationId: listAuthEvents
      summary: Newest authentication audit events first (operators only)
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Audit events, never containing tokens or full email addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthEvent"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lm_session
  responses:
    Problem:
      description: Request could not be completed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Too many attempts from this client or for this address
      headers:
        Retry-After:
          description: Seconds until the current rate-limit window ends
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
    LoginRequestAccepted:
      type: object
      additionalProperties: false
      required: [status, message]
      properties:
        status:
          type: string
          enum: [accepted]
        message:
          type: string
    VerifyRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
    Role:
      type: string
      enum: [user, operator]
    User:
      type: object
      additionalProperties: false
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    Session:
      type: object
      additionalProperties: false
      required: [expires_at, idle_expires_at]
      properties:
        expires_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
    VerifyResponse:
      type: object
      additionalProperties: false
      required: [user, session]
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, role, email_verified_at, session]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        email_verified_at:
          type: [string, "null"]
          format: date-time
        session:
          $ref: "#/components/schemas/Session"
    SessionIntrospection:
      type: object
      additionalProperties: false
      required: [active, user_id, role, expires_at, idle_expires_at]
      properties:
        active:
          const: true
        user_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        expires_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
    AuthEvent:
      type: object
      additionalProperties: false
      required: [id, occurred_at, event_type, reason, user_id, session_id, email_masked]
      properties:
        id:
          type: integer
          minimum: 1
        occurred_at:
          type: string
          format: date-time
        event_type:
          type: string
          enum: [login_requested, login_succeeded, login_failed, logout, rate_limited]
        reason:
          type: [string, "null"]
        user_id:
          type: [string, "null"]
          format: uuid
        session_id:
          type: [string, "null"]
          format: uuid
        email_masked:
          type: [string, "null"]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        invalid_fields:
          description: >-
            Names of declared request fields that failed validation, never their
            values. A field the request should not contain is reported as
            `unexpected_field` rather than by the name the client sent.
          type: array
          items:
            type: string
