openapi: 3.1.0
info:
  title: LedgerMesh Catalog Participant API
  version: 1.0.0
  description: Internal synchronous 2PC API owned by the Rewards Catalog Service.
servers:
  - url: http://catalog:8002
paths:
  /v1/rewards:
    get:
      operationId: listRewards
      summary: List rewards, filtering sold-out rewards by default
      parameters:
        - name: available_only
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Rewards ordered by reward ID
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RewardView"
  /v1/rewards/{reward_id}:
    get:
      operationId: getRewardQuote
      summary: Read the authoritative reward point cost and version
      parameters:
        - $ref: "#/components/parameters/RewardId"
      responses:
        "200":
          description: Current reward quote used by the Coordinator before starting a redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardQuote"
        "404":
          description: Reward does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/rewards/{reward_id}/reservations:
    post:
      operationId: reserveRewardInventory
      summary: Reserve reward inventory idempotently
      parameters:
        - $ref: "#/components/parameters/RewardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveRequest"
      responses:
        "200":
          description: Applied or previously stored reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResult"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/rewards/{reward_id}/releases:
    post:
      operationId: releaseRewardInventory
      summary: Release a reservation or record an early-release tombstone
      parameters:
        - $ref: "#/components/parameters/RewardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseRequest"
      responses:
        "200":
          description: Applied, duplicate, or tombstoned release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResult"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/rewards/{reward_id}/fulfillments:
    post:
      operationId: fulfillRewardReservation
      summary: Mark an active reservation fulfilled
      parameters:
        - $ref: "#/components/parameters/RewardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FulfillRequest"
      responses:
        "200":
          description: Applied or previously stored fulfillment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResult"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/transactions/{transaction_id}/prepare:
    post:
      operationId: prepareInventoryReservation
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogPrepareRequest"
      responses:
        "200":
          description: Durable YES (`PREPARED`) or NO (`ABORTED`) vote, repeated on retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantResponse"
        "409":
          description: Transaction ID already exists with a different prepare request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/transactions/{transaction_id}/commit:
    post:
      operationId: commitInventoryReservation
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Idempotent `COMMITTED` result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantResponse"
        "404":
          description: Transaction is unknown to this participant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Transaction was aborted or is not in a committable state
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/transactions/{transaction_id}/abort:
    post:
      operationId: abortInventoryReservation
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Idempotent `ABORTED` result; an unknown transaction creates an abort tombstone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantResponse"
        "409":
          description: Transaction has already committed and cannot be aborted
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/transactions/{transaction_id}:
    get:
      operationId: getCatalogTransaction
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Participant transaction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantResponse"
        "404":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RewardId:
      name: reward_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Problem:
      description: Participant request failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ReserveRequest:
      type: object
      additionalProperties: false
      required: [transaction_id, quantity]
      properties:
        transaction_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        event_id:
          type: [string, "null"]
          format: uuid
    ReleaseRequest:
      type: object
      additionalProperties: false
      required: [transaction_id, quantity]
      properties:
        transaction_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        event_id:
          type: [string, "null"]
          format: uuid
    FulfillRequest:
      type: object
      additionalProperties: false
      required: [transaction_id]
      properties:
        transaction_id:
          type: string
          format: uuid
        event_id:
          type: [string, "null"]
          format: uuid
    RewardView:
      type: object
      additionalProperties: false
      required:
        - reward_id
        - name
        - point_cost
        - total_inventory
        - available_inventory
        - version
        - updated_at
      properties:
        reward_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        point_cost:
          type: integer
          minimum: 1
        total_inventory:
          type: integer
          minimum: 0
        available_inventory:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
        updated_at:
          type: string
          format: date-time
    ReservationResult:
      type: object
      additionalProperties: false
      required:
        - transaction_id
        - reward_id
        - quantity
        - state
        - outcome
        - available_inventory
        - version
        - updated_at
      properties:
        transaction_id:
          type: string
          format: uuid
        reward_id:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [reserved, released, fulfilled, tombstone]
        outcome:
          type: string
          enum: [applied, duplicate, tombstone]
        available_inventory:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
        updated_at:
          type: string
          format: date-time
    CatalogPrepareRequest:
      type: object
      additionalProperties: false
      required:
        - correlation_id
        - reward_id
        - quantity
        - expected_reward_version
        - expected_point_cost
        - fencing_token
      properties:
        correlation_id:
          type: string
          format: uuid
        reward_id:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        expected_reward_version:
          type: integer
          minimum: 0
        expected_point_cost:
          type: integer
          minimum: 1
        fencing_token:
          type: integer
          minimum: 0
    RewardQuote:
      type: object
      additionalProperties: false
      required: [reward_id, point_cost, available_inventory, version]
      properties:
        reward_id:
          type: string
          minLength: 1
        point_cost:
          type: integer
          minimum: 1
        available_inventory:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
    ParticipantResponse:
      type: object
      additionalProperties: false
      required: [transaction_id, participant, state, updated_at]
      properties:
        transaction_id:
          type: string
          format: uuid
        participant:
          type: string
          const: catalog
        state:
          type: string
          enum: [PREPARED, COMMITTED, ABORTED, IN_DOUBT]
        updated_at:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        transaction_id:
          type: [string, "null"]
          format: uuid
