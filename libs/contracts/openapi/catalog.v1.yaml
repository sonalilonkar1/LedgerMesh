openapi: 3.1.0
info:
  title: LedgerMesh Catalog Participant API
  version: 1.0.0
  description: Internal synchronous 2PC API owned by the Rewards Catalog Service.
servers:
  - url: http://catalog:8002
paths:
  /v1/rewards/{reward_id}:
    get:
      operationId: getRewardQuote
      summary: Read the authoritative reward point cost and version
      parameters:
        - $ref: "#/components/parameters/RewardId"
      responses:
        "200":
          description: Current reward quote used by the Coordinator before starting a redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardQuote"
        "404":
          description: Reward does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/transactions/{transaction_id}/prepare:
    post:
      operationId: prepareInventoryReservation
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogPrepareRequest"
      responses:
        "200":
          description: Durable YES (`PREPARED`) or NO (`ABORTED`) vote, repeated on retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantResponse"
        "409":
          description: Transaction ID already exists with a different prepare request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/transactions/{transaction_id}/commit:
    post:
      operationId: commitInventoryReservation
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Idempotent `COMMITTED` result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantResponse"
        "404":
          description: Transaction is unknown to this participant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Transaction was aborted or is not in a committable state
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/transactions/{transaction_id}/abort:
    post:
      operationId: abortInventoryReservation
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Idempotent `ABORTED` result; an unknown transaction creates an abort tombstone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantResponse"
        "409":
          description: Transaction has already committed and cannot be aborted
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/transactions/{transaction_id}:
    get:
      operationId: getCatalogTransaction
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Participant transaction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantResponse"
        "404":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RewardId:
      name: reward_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Problem:
      description: Participant request failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    CatalogPrepareRequest:
      type: object
      additionalProperties: false
      required:
        - correlation_id
        - reward_id
        - quantity
        - expected_reward_version
        - expected_point_cost
      properties:
        correlation_id:
          type: string
          format: uuid
        reward_id:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        expected_reward_version:
          type: integer
          minimum: 0
        expected_point_cost:
          type: integer
          minimum: 1
    RewardQuote:
      type: object
      additionalProperties: false
      required: [reward_id, point_cost, available_inventory, version]
      properties:
        reward_id:
          type: string
          minLength: 1
        point_cost:
          type: integer
          minimum: 1
        available_inventory:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
    ParticipantResponse:
      type: object
      additionalProperties: false
      required: [transaction_id, participant, state, updated_at]
      properties:
        transaction_id:
          type: string
          format: uuid
        participant:
          type: string
          const: catalog
        state:
          type: string
          enum: [PREPARED, COMMITTED, ABORTED, IN_DOUBT]
        updated_at:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        transaction_id:
          type: [string, "null"]
          format: uuid
