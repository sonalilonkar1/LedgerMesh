[project]
name = "ledgermesh"
version = "0.1.0"
description = "Distributed rewards system comparing Two-Phase Commit and Saga coordination"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "ledgermesh-messaging",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.2,<10",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
# Services share the inbox/outbox tables and envelope from the messaging library.
ledgermesh-messaging = { path = "libs/messaging", editable = true }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["services"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
    "database: needs PostgreSQL (make infra-up, or LM_TEST_POSTGRES_URL)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
