name: ledgermesh

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 10s

x-service-healthcheck: &service-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  kafka:
    image: apache/kafka:4.4.0
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [backend]

  coordinator-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    shm_size: 128mb
    command: ["postgres", "-c", "max_prepared_transactions=100"]
    ports:
      - "${COORDINATOR_DB_PORT:-54321}:5432"
    environment:
      POSTGRES_USER: coordinator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgermesh_dev}
      POSTGRES_DB: coordinator
    volumes:
      - coordinator_db_data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
    networks: [backend]

  wallet-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    shm_size: 128mb
    command: ["postgres", "-c", "max_prepared_transactions=100"]
    ports:
      - "${WALLET_DB_PORT:-54322}:5432"
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgermesh_dev}
      POSTGRES_DB: wallet
    volumes:
      - wallet_db_data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
    networks: [backend]

  catalog-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    shm_size: 128mb
    command: ["postgres", "-c", "max_prepared_transactions=100"]
    ports:
      - "${CATALOG_DB_PORT:-54323}:5432"
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgermesh_dev}
      POSTGRES_DB: catalog
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
    networks: [backend]

  audit-ledger-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    shm_size: 128mb
    command: ["postgres", "-c", "max_prepared_transactions=100"]
    ports:
      - "${AUDIT_LEDGER_DB_PORT:-54324}:5432"
    environment:
      POSTGRES_USER: audit_ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgermesh_dev}
      POSTGRES_DB: audit_ledger
    volumes:
      - audit_ledger_db_data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
    networks: [backend]

  identity-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    shm_size: 128mb
    # Identity takes no part in 2PC; the setting keeps every local server alike
    # (infra/README.md, smoke test).
    command: ["postgres", "-c", "max_prepared_transactions=100"]
    ports:
      - "${IDENTITY_DB_PORT:-54325}:5432"
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgermesh_dev}
      POSTGRES_DB: identity
    volumes:
      - identity_db_data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
    networks: [backend]

  # Local test inbox for sign-in emails (LM-052). Nothing is delivered to the
  # internet; open http://localhost:8025 to read the messages.
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: "500"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "/mailpit", "readyz"]
    networks: [backend]

  coordinator:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
    # Apply migrations (LM-005) before serving; a failed migration stops the container.
    command: ["sh", "-c", "alembic -c services/coordinator/alembic.ini upgrade head && exec python -m uvicorn services.coordinator.app.main:app --host 0.0.0.0 --port 8000"]
    init: true
    ports:
      - "${COORDINATOR_PORT:-8000}:8000"
    environment:
      SERVICE_NAME: coordinator
      LEDGERMESH_ENV: local
      DATABASE_URL: postgresql+psycopg://coordinator:${POSTGRES_PASSWORD:-ledgermesh_dev}@coordinator-db:5432/coordinator
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      COORDINATOR_RECOVERY_ENABLED: "true"
      COORDINATOR_RECOVERY_INTERVAL_SECONDS: "5"
      WALLET_URL: http://wallet:8001
      CATALOG_URL: http://catalog:8002
    depends_on:
      coordinator-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
    networks: [backend]

  wallet:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
    command: ["sh", "-c", "alembic -c services/wallet/alembic.ini upgrade head && exec python -m uvicorn services.wallet.app.main:app --host 0.0.0.0 --port 8001"]
    init: true
    ports:
      - "${WALLET_PORT:-8001}:8001"
    environment:
      SERVICE_NAME: wallet
      DATABASE_URL: postgresql+psycopg://wallet:${POSTGRES_PASSWORD:-ledgermesh_dev}@wallet-db:5432/wallet
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      wallet-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
    networks: [backend]

  catalog:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
    command: ["sh", "-c", "alembic -c services/catalog/alembic.ini upgrade head && exec python -m uvicorn services.catalog.app.main:app --host 0.0.0.0 --port 8002"]
    init: true
    ports:
      - "${CATALOG_PORT:-8002}:8002"
    environment:
      SERVICE_NAME: catalog
      DATABASE_URL: postgresql+psycopg://catalog:${POSTGRES_PASSWORD:-ledgermesh_dev}@catalog-db:5432/catalog
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      catalog-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]
    networks: [backend]

  audit-ledger:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
    command: ["sh", "-c", "alembic -c services/audit_ledger/alembic.ini upgrade head && exec python -m uvicorn services.audit_ledger.app.main:app --host 0.0.0.0 --port 8003"]
    init: true
    ports:
      - "${AUDIT_LEDGER_PORT:-8003}:8003"
    environment:
      SERVICE_NAME: audit-ledger
      DATABASE_URL: postgresql+psycopg://audit_ledger:${POSTGRES_PASSWORD:-ledgermesh_dev}@audit-ledger-db:5432/audit_ledger
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      audit-ledger-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=2)"]
    networks: [backend]

  identity:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
    command: ["sh", "-c", "alembic -c services/identity/alembic.ini upgrade head && exec python -m uvicorn services.identity.app.main:app --host 0.0.0.0 --port 8005"]
    init: true
    ports:
      - "${IDENTITY_PORT:-8005}:8005"
    environment:
      SERVICE_NAME: identity
      LEDGERMESH_ENV: local
      DATABASE_URL: postgresql+psycopg://identity:${POSTGRES_PASSWORD:-ledgermesh_dev}@identity-db:5432/identity
      IDENTITY_SMTP_HOST: mailpit
      IDENTITY_SMTP_PORT: "1025"
      IDENTITY_LOGIN_LINK_URL: http://localhost:${IDENTITY_PORT:-8005}/v1/auth/verify
      IDENTITY_OPERATOR_EMAILS: ${IDENTITY_OPERATOR_EMAILS:-operator@example.com}
      # Same defaults as the service; raise them when re-running identity-e2e often.
      IDENTITY_LOGIN_LIMIT_PER_EMAIL: ${IDENTITY_LOGIN_LIMIT_PER_EMAIL:-5}
      IDENTITY_LOGIN_LIMIT_PER_IP: ${IDENTITY_LOGIN_LIMIT_PER_IP:-20}
      IDENTITY_VERIFY_LIMIT_PER_IP: ${IDENTITY_VERIFY_LIMIT_PER_IP:-30}
    depends_on:
      identity-db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=2)"]
    networks: [backend]

networks:
  backend:
    name: ledgermesh-backend

volumes:
  kafka_data:
  coordinator_db_data:
  wallet_db_data:
  catalog_db_data:
  audit_ledger_db_data:
  identity_db_data:

