# The four FastAPI services (compose.yaml:116-209), LM-041.
#
# - The main container runs the image's default command, /app/start-service.sh
#   (Dockerfile.service:62), with RUN_MIGRATIONS=false.
# - The "migrate" init container runs the same command start-service.sh:13 runs,
#   `alembic -c services/<svc>/alembic.ini upgrade head`, so a failed migration
#   blocks the start (as compose.yaml:120-121 do) and probes never wait on it. It
#   retries for up to ~2 minutes while the database starts; PostgreSQL DDL is
#   transactional, so a retried upgrade is safe.
# - One replica with the Recreate strategy, so two migrations never race.
# - Probes call GET /health, which returns {"status":"ok","service":...}
#   without touching the database or Kafka (coordinator main.py:106-108).
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  labels:
    app.kubernetes.io/name: coordinator
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: coordinator
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  labels:
    app.kubernetes.io/name: coordinator
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coordinator
        app.kubernetes.io/component: api
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ledgermesh-coordinator
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              for i in $(seq 1 60); do
              alembic -c services/coordinator/alembic.ini upgrade head && exit 0;
              echo "migration attempt $i failed; retrying"; sleep 2; done; exit 1
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledgermesh-db
                  key: POSTGRES_PASSWORD
            # migrations/env.py:19 reads DATABASE_URL; format from compose.yaml.
            - name: DATABASE_URL
              value: postgresql+psycopg://coordinator:$(POSTGRES_PASSWORD)@coordinator-db:5432/coordinator
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: coordinator
          image: ledgermesh-coordinator
          imagePullPolicy: IfNotPresent
          # compose.yaml:125-133: the Coordinator gets the whole shared config.
          envFrom:
            - configMapRef:
                name: ledgermesh-config
          env:
            - name: SERVICE_NAME
              value: coordinator
            - name: RUN_MIGRATIONS
              value: "false"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledgermesh-db
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg://coordinator:$(POSTGRES_PASSWORD)@coordinator-db:5432/coordinator
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: ledgermesh-config
                  key: KAFKA_BOOTSTRAP_SERVERS
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
